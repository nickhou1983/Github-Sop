<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Code Token 优化关键技术详解</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f8fa;
    --bg-sidebar: #fbfcfd;
    --text: #1f2328;
    --text-soft: #59636e;
    --border: #d1d9e0;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --quote-border: #d0d7de;
    --table-stripe: #f6f8fa;
    --shadow: 0 1px 3px rgba(31,35,40,.12);
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-sidebar: #0d1117;
    --text: #e6edf3;
    --text-soft: #9198a1;
    --border: #30363d;
    --accent: #4493f8;
    --accent-soft: #121d2f;
    --quote-border: #3d444d;
    --table-stripe: #161b22;
    --shadow: 0 1px 3px rgba(1,4,9,.5);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .logo {
    width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, #0969da, #1f6feb);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .sub { color: var(--text-soft); font-size: 12px; white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
    border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .menu-toggle { display: none; }

  .layout { display: flex; max-width: 1320px; margin: 0 auto; }

  /* Sidebar */
  aside {
    width: 290px; flex-shrink: 0;
    position: sticky; top: 55px; align-self: flex-start;
    height: calc(100vh - 55px); overflow-y: auto;
    padding: 22px 12px 60px 22px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
  }
  aside .toc-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); margin: 0 0 10px 8px; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside a {
    display: block; padding: 5px 10px; margin: 1px 0;
    color: var(--text-soft); text-decoration: none; font-size: 13.5px;
    border-radius: 6px; border-left: 2px solid transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  aside a:hover { background: var(--bg-soft); color: var(--text); }
  aside a.active { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
  aside a.lvl-3 { padding-left: 22px; font-size: 12.5px; }

  /* Content */
  main { flex: 1; min-width: 0; padding: 36px 48px 120px; }
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; z-index: 60; transition: width .1s; }

  article h1 { font-size: 30px; padding-bottom: 14px; border-bottom: 2px solid var(--border); margin-top: 8px; }
  article h2 { font-size: 23px; margin-top: 44px; padding-top: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); scroll-margin-top: 70px; }
  article h3 { font-size: 18px; margin-top: 30px; scroll-margin-top: 70px; }
  article h4 { font-size: 15.5px; margin-top: 22px; color: var(--text-soft); scroll-margin-top: 70px; }
  article p { margin: 14px 0; }
  article a { color: var(--accent); text-decoration: none; }
  article a:hover { text-decoration: underline; }

  article blockquote {
    margin: 16px 0; padding: 2px 18px; color: var(--text-soft);
    border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0;
  }
  article ul, article ol { padding-left: 26px; }
  article li { margin: 5px 0; }

  article code {
    font-family: var(--mono); font-size: .87em;
    background: var(--bg-soft); padding: .15em .4em; border-radius: 5px;
    border: 1px solid var(--border);
  }
  article pre {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; overflow-x: auto; box-shadow: var(--shadow); line-height: 1.5;
  }
  article pre code { background: none; border: none; padding: 0; font-size: 13px; white-space: pre; }

  article table {
    border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 14px;
    display: block; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px;
  }
  article th, article td { border: 1px solid var(--border); padding: 9px 13px; text-align: left; }
  article th { background: var(--bg-soft); font-weight: 600; }
  article tbody tr:nth-child(even) { background: var(--table-stripe); }

  article hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

  .mermaid { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; margin: 18px 0; }

  /* status emoji pills inside metadata lines */
  article p strong + em { color: var(--text-soft); }

  footer { text-align: center; color: var(--text-soft); font-size: 13px; padding: 30px; border-top: 1px solid var(--border); }

  #loading { text-align: center; padding: 80px 20px; color: var(--text-soft); }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    aside { position: fixed; left: 0; top: 55px; z-index: 40; transform: translateX(-100%); transition: transform .25s; box-shadow: var(--shadow); }
    aside.open { transform: translateX(0); }
    .menu-toggle { display: inline-flex; }
    main { padding: 24px 20px 100px; }
    .topbar .sub { display: none; }
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="topbar">
  <button class="btn menu-toggle" id="menuToggle" aria-label="目录">☰</button>
  <div class="logo">VS</div>
  <div style="min-width:0">
    <h1>VS Code Token 优化关键技术详解</h1>
    <div class="sub">GitHub Copilot 按用量计费时代的 Token 优化策略</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="themeToggle" aria-label="切换主题">🌙 深色</button>
</div>

<div class="layout">
  <aside id="sidebar">
    <p class="toc-title">目录</p>
    <ul id="toc"></ul>
  </aside>
  <main>
    <div id="loading"><div class="spinner"></div>正在加载文档…</div>
    <article id="content" style="display:none"></article>
    <footer id="footer" style="display:none"></footer>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
<script>
const MD_FILE = "VSCode/vscode-token-optimization-techniques.md";

function slugify(text) {
  return text.toString().trim().toLowerCase()
    .replace(/[\s]+/g, "-")
    .replace(/[^\p{L}\p{N}\-]/gu, "");
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("tok-theme", theme);
  document.getElementById("themeToggle").textContent = theme === "dark" ? "☀️ 浅色" : "🌙 深色";
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: theme === "dark" ? "dark" : "default", securityLevel: "loose" });
    renderMermaid();
  }
}

let mermaidBlocks = [];
function collectMermaid(html) {
  // marked renders ```mermaid into <pre><code class="language-mermaid">
  return html;
}

function renderMermaid() {
  document.querySelectorAll("pre code.language-mermaid").forEach((el, i) => {
    const pre = el.parentElement;
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = el.textContent;
    pre.replaceWith(div);
  });
  try {
    mermaid.run({ querySelector: ".mermaid" });
  } catch (e) { console.warn(e); }
}

async function load() {
  let md;
  try {
    const res = await fetch(MD_FILE, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    md = await res.text();
  } catch (e) {
    document.getElementById("loading").innerHTML =
      '<p>⚠️ 无法加载 <code>' + MD_FILE + '</code>。</p>' +
      '<p style="font-size:13px">请通过本地服务器或 GitHub Pages 打开本页（直接双击 file:// 受浏览器安全策略限制无法读取同目录文件）。<br>' +
      '例如在该目录运行 <code>python3 -m http.server</code> 后访问 <code>http://localhost:8000/</code>。</p>';
    return;
  }

  marked.setOptions({
    gfm: true,
    breaks: false,
    highlight: function (code, lang) {
      if (lang === "mermaid") return code;
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
      }
      return hljs.highlightAuto(code).value;
    }
  });

  // Custom renderer to add ids to headings
  const renderer = new marked.Renderer();
  const headings = [];
  renderer.heading = function (text, level, raw) {
    const id = slugify(raw);
    if (level === 2 || level === 3) headings.push({ id, text: text.replace(/<[^>]+>/g, ""), level });
    return `<h${level} id="${id}">${text}</h${level}>`;
  };

  let html = marked.parse(md, { renderer });
  const content = document.getElementById("content");
  content.innerHTML = html;

  // Build TOC
  const toc = document.getElementById("toc");
  headings.forEach(h => {
    if (h.text === "目录") return;
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.text;
    a.className = h.level === 3 ? "lvl-3" : "lvl-2";
    a.dataset.target = h.id;
    li.appendChild(a);
    toc.appendChild(li);
  });

  // highlight already applied via marked highlight option for fenced langs; apply to remaining
  document.querySelectorAll("pre code:not(.language-mermaid)").forEach(b => {
    if (!b.classList.contains("hljs")) hljs.highlightElement(b);
  });

  renderMermaid();

  document.getElementById("loading").style.display = "none";
  content.style.display = "block";
  const footer = document.getElementById("footer");
  footer.style.display = "block";
  footer.innerHTML = '由 Markdown 自动渲染 · 数据来源见文末参考链接 · ' + new Date().getFullYear();

  setupScrollSpy();
}

function setupScrollSpy() {
  const links = Array.from(document.querySelectorAll("#toc a"));
  const map = new Map();
  links.forEach(a => map.set(a.dataset.target, a));
  const targets = Array.from(document.querySelectorAll("article h2, article h3"));

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        links.forEach(a => a.classList.remove("active"));
        const a = map.get(en.target.id);
        if (a) {
          a.classList.add("active");
          a.scrollIntoView({ block: "nearest" });
        }
      }
    });
  }, { rootMargin: "-65px 0px -75% 0px" });

  targets.forEach(t => observer.observe(t));

  // reading progress
  window.addEventListener("scroll", () => {
    const h = document.documentElement;
    const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight);
    document.getElementById("progress").style.width = (scrolled * 100) + "%";
  });
}

// theme
document.getElementById("themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(cur);
});
// sidebar toggle (mobile)
document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("sidebar").addEventListener("click", (e) => {
  if (e.target.tagName === "A" && window.innerWidth <= 900) {
    document.getElementById("sidebar").classList.remove("open");
  }
});

applyTheme(localStorage.getItem("tok-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
load();
</script>
</body>
</html>

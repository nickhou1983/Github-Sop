<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VS Code Token 优化关键技术详解</title>
  <meta name="description" content="基于 VS Code v1.118–v1.124 版本更新内容整理的 Token 优化关键技术详解" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <style>
    :root {
      --bg: #0d1117;
      --bg-soft: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-soft: #9da7b3;
      --accent: #58a6ff;
      --accent-soft: #1f6feb;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --sidebar-w: 300px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      line-height: 1.7;
      font-size: 16px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .layout { display: flex; min-height: 100vh; }

    /* Sidebar TOC */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 24px 18px;
    }
    .sidebar h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      margin: 0 0 14px 4px;
    }
    .sidebar nav a {
      display: block;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--text-soft);
      font-size: 14px;
      border-left: 2px solid transparent;
      margin-bottom: 2px;
    }
    .sidebar nav a:hover { background: rgba(88,166,255,0.08); color: var(--text); text-decoration: none; }
    .sidebar nav a.active { color: var(--accent); border-left-color: var(--accent); background: rgba(88,166,255,0.10); }
    .sidebar nav a.lvl-3 { padding-left: 22px; font-size: 13px; }

    /* Main */
    .main { flex: 1; min-width: 0; display: flex; justify-content: center; }
    .content {
      max-width: 920px;
      width: 100%;
      padding: 48px 40px 120px;
    }

    .hero {
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(31,111,235,0.12), rgba(63,185,80,0.06));
      border-radius: 14px;
      padding: 28px 32px;
      margin-bottom: 40px;
    }
    .hero .badge {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid var(--accent-soft);
      border-radius: 999px;
      padding: 3px 12px;
      margin-bottom: 14px;
    }

    article h1 { font-size: 30px; line-height: 1.3; margin: 0 0 8px; }
    article h2 {
      font-size: 24px;
      margin: 48px 0 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 20px;
    }
    article h3 { font-size: 19px; margin: 32px 0 12px; scroll-margin-top: 20px; }
    article h4 { font-size: 16px; margin: 22px 0 10px; color: var(--text-soft); }
    article p { margin: 12px 0; }

    article blockquote {
      margin: 16px 0;
      padding: 8px 18px;
      border-left: 4px solid var(--accent-soft);
      background: rgba(88,166,255,0.06);
      color: var(--text-soft);
      border-radius: 0 8px 8px 0;
    }

    article ul, article ol { padding-left: 24px; }
    article li { margin: 6px 0; }

    article hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

    /* Tables */
    article table {
      border-collapse: collapse;
      width: 100%;
      margin: 18px 0;
      font-size: 14px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    article th, article td {
      border: 1px solid var(--border);
      padding: 9px 14px;
      text-align: left;
      vertical-align: top;
    }
    article thead th { background: var(--bg-soft); color: var(--text); font-weight: 600; }
    article tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }

    /* Inline code */
    article code {
      background: rgba(110,118,129,0.18);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.88em;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    article pre {
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    article pre code { background: none; padding: 0; font-size: 13px; }

    /* Mermaid */
    .mermaid {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }

    .loading { text-align: center; color: var(--text-soft); padding: 80px 0; }

    .footer-note {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-soft);
      font-size: 13px;
    }

    /* Mobile */
    .menu-toggle {
      display: none;
      position: fixed;
      top: 14px; left: 14px;
      z-index: 50;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 18px;
    }
    @media (max-width: 1000px) {
      .menu-toggle { display: block; }
      .sidebar {
        position: fixed;
        left: 0; top: 0;
        z-index: 40;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 64px 20px 100px; }
    }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="目录">☰</button>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h2>目录</h2>
      <nav id="toc"></nav>
    </aside>
    <div class="main">
      <div class="content">
        <div class="hero">
          <span class="badge">VS Code · GitHub Copilot</span>
          <h1>VS Code Token 优化关键技术详解</h1>
          <p style="margin:6px 0 0;color:var(--text-soft);">基于 VS Code v1.118–v1.124（2026 年 4 月–6 月）版本更新内容整理</p>
        </div>
        <article id="article">
          <div class="loading">正在加载文档…</div>
        </article>
        <div class="footer-note">
          本页由 <code>vscode-token-optimization-techniques.md</code> 自动渲染生成 · 通过 GitHub Pages 发布
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });

    const MD_FILE = "vscode-token-optimization-techniques.md";

    function slugify(text) {
      return text.toString().trim().toLowerCase()
        .replace(/[\s]+/g, "-")
        .replace(/[^\w\u4e00-\u9fa5-]/g, "");
    }

    async function render() {
      let md;
      try {
        const res = await fetch(MD_FILE, { cache: "no-cache" });
        if (!res.ok) throw new Error(res.status);
        md = await res.text();
      } catch (e) {
        document.getElementById("article").innerHTML =
          '<p style="color:var(--red)">无法加载 Markdown 文件：' + e.message + "</p>";
        return;
      }

      // Configure marked
      const renderer = new marked.Renderer();
      const slugCount = {};
      renderer.heading = function (text, level, raw) {
        let slug = slugify(raw);
        if (slugCount[slug] != null) { slugCount[slug]++; slug = slug + "-" + slugCount[slug]; }
        else { slugCount[slug] = 0; }
        return `<h${level} id="${slug}">${text}</h${level}>`;
      };

      marked.setOptions({
        renderer,
        gfm: true,
        breaks: false,
        headerIds: false,
        mangle: false
      });

      let html = marked.parse(md);
      const article = document.getElementById("article");
      article.innerHTML = html;

      // Convert ```mermaid code blocks into mermaid divs
      article.querySelectorAll("code.language-mermaid").forEach((code) => {
        const pre = code.closest("pre");
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        pre.replaceWith(div);
      });

      // Highlight remaining code blocks (skip mermaid)
      article.querySelectorAll("pre code").forEach((block) => {
        window.hljs.highlightElement(block);
      });

      try { await mermaid.run({ querySelector: ".mermaid" }); } catch (e) { /* ignore */ }

      buildToc(article);
      setupScrollSpy();
    }

    function buildToc(article) {
      const toc = document.getElementById("toc");
      const headings = article.querySelectorAll("h2, h3");
      headings.forEach((h) => {
        const a = document.createElement("a");
        a.href = "#" + h.id;
        a.textContent = h.textContent;
        a.className = h.tagName === "H3" ? "lvl-3" : "lvl-2";
        a.dataset.target = h.id;
        toc.appendChild(a);
      });
    }

    function setupScrollSpy() {
      const links = [...document.querySelectorAll("#toc a")];
      const map = new Map(links.map((l) => [l.dataset.target, l]));
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            links.forEach((l) => l.classList.remove("active"));
            const active = map.get(entry.target.id);
            if (active) active.classList.add("active");
          }
        });
      }, { rootMargin: "-10% 0px -80% 0px", threshold: 0 });
      document.querySelectorAll("#article h2, #article h3").forEach((h) => observer.observe(h));
    }

    // Mobile menu
    const toggle = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");
    toggle.addEventListener("click", () => sidebar.classList.toggle("open"));
    sidebar.addEventListener("click", (e) => { if (e.target.tagName === "A") sidebar.classList.remove("open"); });

    render();
  </script>
</body>
</html>
